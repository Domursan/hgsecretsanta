<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Humane Gang's Secret Santa 🎅</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/index.css" />
</head>
<body>

  <div id="navbar-container"></div>

  <main class="main-content">

    <!-- Hero -->
    <section class="hero animate-in">
      <h1 class="rainbow-text">Bienvenue !</h1>
      <p>Organisation, inscriptions et votes ! 🎁</p>
    </section>

    <div class="rainbow-divider"></div>

    <!-- Progression des cadeaux -->
    <h2 class="section-title">🎄 Où en sont les cadeaux ?</h2>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <linearGradient id="ring-gradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff4e6a"/><stop offset="35%" stop-color="#ffd166"/>
          <stop offset="70%" stop-color="#06d6a0"/><stop offset="100%" stop-color="#9b5de5"/>
        </linearGradient>
      </defs>
    </svg>
    <div class="progress-box" id="progression" aria-live="polite">
      <div class="progress-card">
        <div class="ring" id="ring-envoyes">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="52"/>
            <circle class="ring-fg" cx="60" cy="60" r="52" stroke="url(#ring-gradient)"/>
          </svg>
          <div class="ring-center">
            <span class="ring-value">–</span>
            <small class="ring-total"></small>
          </div>
        </div>
        <p class="ring-label">📦 Cadeaux envoyés</p>
      </div>
      <div class="progress-card">
        <div class="ring" id="ring-recus">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="52"/>
            <circle class="ring-fg" cx="60" cy="60" r="52" stroke="url(#ring-gradient)"/>
          </svg>
          <div class="ring-center">
            <span class="ring-value">–</span>
            <small class="ring-total"></small>
          </div>
        </div>
        <p class="ring-label">🎁 Cadeaux reçus</p>
      </div>
    </div>
    <p id="progress-note" class="countdown-label">Connecte-toi dans « Mon espace » pour valider ton envoi et ta réception.</p>

    <div class="rainbow-divider"></div>

    <h2 class="section-title">🎁 Les participants 👀</h2>
    <div id="participants-grid" class="participants-grid"></div>

  </main>

  <div id="footer-container"></div>

  <script src="assets/js/main.js"></script>
  <script>
    /* Progression des envois / réceptions (compteurs publics, sans noms) */
    const CIRC = 2 * Math.PI * 52;

    function setRing(id, n, total) {
      const ring = document.getElementById('ring-' + id);
      const fg = ring.querySelector('.ring-fg');
      const ratio = total ? Math.min(n / total, 1) : 0;
      fg.style.strokeDasharray = CIRC;
      fg.style.strokeDashoffset = CIRC * (1 - ratio);
      ring.querySelector('.ring-value').textContent = n;
      ring.querySelector('.ring-total').textContent = 'sur ' + total;
      ring.setAttribute('aria-label', n + ' sur ' + total);
    }

    async function loadProgression() {
      document.querySelectorAll('.ring-fg').forEach(c => {
        c.style.strokeDasharray = CIRC; c.style.strokeDashoffset = CIRC;
      });
      try {
        const data = await apiFetch('progression');
        if (!data.ok) throw new Error(data.erreur);
        setRing('envoyes', data.envoyes, data.total);
        setRing('recus', data.recus, data.total);
        if (data.total && data.recus === data.total) {
          document.getElementById('progress-note').textContent = '🎉 Tout le monde a reçu son cadeau, joyeux Noël !';
        }
      } catch (e) {
        document.getElementById('progress-note').textContent = 'Progression indisponible pour le moment.';
      }
    }
    document.addEventListener('DOMContentLoaded', loadProgression);
  </script>

<script>

  // 👉 Ajoute un prénom par personne inscrite
  const PARTICIPANTS = [
    "Nagarythe",
    "Waenniliel",
    "Domursan",
    "Litverkzad",
    "Terrow",
    "Bouba",
    "SwanNex",
    "Xalina",
    "Myce",
    "Carzy",
    "Izinsalea",
    "Destrukid",
  ];

  function renderParticipants() {
    const grid = document.getElementById('participants-grid');
    grid.innerHTML = PARTICIPANTS.map(nom => `
      <div class="participant-card">${nom}</div>
    `).join('');
  }

  document.addEventListener('DOMContentLoaded', renderParticipants);
</script>

</body>
</html>
