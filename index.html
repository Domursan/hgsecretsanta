<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Humane Gang's Secret Santa 🎅</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/index.css" />
</head>
<body>

  <div id="navbar-container"></div>

  <main class="main-content">

    <!-- Hero -->
    <section class="hero animate-in">
      <h1 class="rainbow-text">Bienvenue !</h1>
      <p>Organisation, inscriptions et votes ! 🎁</p>
    </section>

    <div class="rainbow-divider"></div>

    <!-- Comment ça marche -->
    <!-- <h2 class="section-title">✨ Les inscriptions sont ouvertes 👀</h2> -->
    <div id="countdown" class="countdown-box">
      <div class="countdown-item">
        <span id="cd-jours">--</span>
        <small>jours</small>
      </div>
      <span class="countdown-separator">:</span>
      <div class="countdown-item">
        <span id="cd-heures">--</span>
        <small>heures</small>
      </div>
      <span class="countdown-separator">:</span>
      <div class="countdown-item">
        <span id="cd-minutes">--</span>
        <small>min</small>
      </div>
      <span class="countdown-separator">:</span>
      <div class="countdown-item">
        <span id="cd-secondes">--</span>
        <small>sec</small>
      </div>
    </div>
    <p id="countdown-label" class="countdown-label">avant la fin des inscriptions</p>
    
    <div class="rainbow-divider"></div>

    <h2 class="section-title">🎁 Les participants 👀</h2>
    <div id="participants-grid" class="participants-grid"></div>

  </main>

  <div id="footer-container"></div>

  <script src="assets/js/main.js"></script>
  <script>
    // Charger les stats depuis l'API (placeholder)
    async function loadStats() {
      try {
        const data = await apiFetch('getStats');
        if (data.inscrits !== undefined) document.getElementById('stat-inscrits').textContent = data.inscrits;
        if (data.votes    !== undefined) document.getElementById('stat-votes').textContent    = data.votes;
        if (data.dateEchange) {
          const jours = Math.ceil((new Date(data.dateEchange) - new Date()) / (1000*60*60*24));
          document.getElementById('stat-jours').textContent = jours > 0 ? jours : '🎉';
        }
      } catch(e) {
        // API pas encore configurée — on affiche des placeholders
        document.getElementById('stat-inscrits').textContent = '?';
        document.getElementById('stat-votes').textContent    = '?';
        document.getElementById('stat-jours').textContent    = '?';
      }
    }
    document.addEventListener('DOMContentLoaded', loadStats);
  </script>

  <script>
  const DATE_FIN_INSCRIPTIONS = new Date('2026-09-30T23:59:00');

  function updateCountdown() {
    const maintenant = new Date();
    const diff = DATE_FIN_INSCRIPTIONS - maintenant;

    if (diff <= 0) {
      document.getElementById('countdown').style.display = 'none';
      document.getElementById('countdown-label').textContent = '🎉 Les inscriptions sont terminées !';
      return;
    }

    const jours    = Math.floor(diff / (1000 * 60 * 60 * 24));
    const heures   = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes  = Math.floor((diff / (1000 * 60)) % 60);
    const secondes = Math.floor((diff / 1000) % 60);

    document.getElementById('cd-jours').textContent    = jours;
    document.getElementById('cd-heures').textContent   = String(heures).padStart(2, '0');
    document.getElementById('cd-minutes').textContent  = String(minutes).padStart(2, '0');
    document.getElementById('cd-secondes').textContent = String(secondes).padStart(2, '0');
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

<script>

  // 👉 Ajoute un prénom par personne inscrite
  const PARTICIPANTS = [
    "Nagarythe",
    "Waenniliel",
    "Domursan",
    "Litverkzad",
    "Terrow",
    "Bouba",
    "SwanNex",
    "Xalina",
    "Myce",
    "Carzy",
    "izinsalea",
  ];

  function renderParticipants() {
    const grid = document.getElementById('participants-grid');
    grid.innerHTML = PARTICIPANTS.map(nom => `
      <div class="participant-card">${nom}</div>
    `).join('');
  }

  document.addEventListener('DOMContentLoaded', renderParticipants);
</script>

</body>
</html>
